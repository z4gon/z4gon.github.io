name: 'Deploy'

on:
  push:
    branches: [main]

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Format Check + Build
    runs-on: ubuntu-latest
    steps:
      # lfs: false = pointer files only, no media download
      # pointer files embed each file's sha256, so hashing them gives a content key for public/res
      - uses: actions/checkout@v4
        with:
          lfs: false
      # saves lfs bandwidth quota:
      # - unchanged media -> exact hit on the content hash
      # - changed media -> restore-keys pulls the latest lfs-* cache, so lfs pull below only fetches new objects
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('public/res/**/*') }}
          restore-keys: lfs-
      # materialize real media; downloads only missing objects, zero on exact hit
      - run: git lfs install && git lfs pull
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run build
      # tell github pages to not use jekyll
      - run: touch dist/.nojekyll
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: dist

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test

  deploy:
    name: Deploy
    needs: [check, test]

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      # Deploy to Pages
      pages: write
      # Verify the deployment originates from an appropriate source
      id-token: write

    # Recommended if you intend to make multiple deployments in quick succession.
    concurrency: deploy-${{ github.ref }}

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
